<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>診断結果</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Yu Gothic', sans-serif; margin: 24px; max-width: 720px; line-height: 1.6; }
    h1 { font-size: 1.5rem; margin-bottom: 16px; }
    .status { font-size: 1.2rem; margin: 12px 0; padding: 8px 12px; background: #f0f4f8; border-radius: 6px; }
    .score { font-size: 1.1rem; margin: 12px 0; }
    .section { margin: 20px 0; padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
    .footer { margin-top: 32px; padding: 12px; font-size: 0.85rem; color: #666; border-top: 1px solid #ddd; }
    ul { margin: 8px 0; padding-left: 20px; }
  </style>
</head>
<body>
  <h1>診断結果</h1>
  <div class="status">判定: A（良好）</div>
  <div class="score">総合スコア: 85.25</div>
  <div class="section">
    <strong>説明</strong>
    <p>診断結果をご確認いただき、入国在留に詳しい専門家への相談をご検討ください。</p>
  </div>
  <div class="section"><strong>確認事項</strong><ul><li>フラグされた項目を確認してください</li><li>専門家に相談してください</li><li>必要な書類を準備してください</li></ul></div>
  <div class="footer">本診断結果は参考情報です。最終的な判断は入国管理局が行います。</div>
</body>
</html>
